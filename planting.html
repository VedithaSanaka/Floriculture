    <link rel="stylesheet" href="Flower.css">
    <title>Planting Calendar</title>

<body>
<!--Planting Calendar section starts-->
<section class="calendar" id="calendar">
    <h1 class="heading"><span data-key="calendar-heading">Planting Calendar</span></h1>
    <div class="content">
        <h3 data-key="calendar-title">Best Planting Times for Flowering Plants</h3>
        <form id="calendarForm">
            <label for="region" data-key="calendar-region">Select Your Region:</label>
            <select id="region">
                <option value="coastal" data-key="coastal">Coastal</option>
                <option value="drought" data-key="drought">Drought-Prone</option>
                <option value="wet" data-key="wet">Wet Region</option>
                <option value="hill" data-key="hill">Hill Region</option>
            </select>
            <button type="button" data-key="show-calendar-button" onclick="showCalendar()">Show Calendar</button>
        </form>
        <table id="plantingTable" style="display:none;">
            <thead>
                <tr>
                    <th data-key="month-heading">Month</th>
                    <th data-key="flowering-plants-heading">Flowering Plants</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Rows will be dynamically added here -->
            </tbody>
        </table>
    </div>
</section>

            August: "Jasmine",
            September: "Chrysanthemum",
            October: "Hibiscus",
            November: "Marigold",
            December: "Rose"
        }
    };

    // Get the language from the URL query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const selectedLang = urlParams.get('lang') || 'en'; // Default to 'en' if no lang param exists

    function showCalendar() {
        const region = document.getElementById('region').value;
        const tableBody = document.getElementById('tableBody');
        const data = plantingData[region];

        tableBody.innerHTML = ""; // Clear previous rows

        for (const [month, plants] of Object.entries(data)) {
            const row = document.createElement('tr');
            const monthCell = document.createElement('td');
            const plantsCell = document.createElement('td');

            // Translate month and flower names based on selected language
            monthCell.textContent = translations[selectedLang][month] || month;
            plantsCell.textContent = plants.split(', ').map(flower => translations[selectedLang][flower] || flower).join(', ');

            row.appendChild(monthCell);
            row.appendChild(plantsCell);
            tableBody.appendChild(row);
        }

        // Update headings and button labels
        document.querySelectorAll('[data-key]').forEach(element => {
            const key = element.getAttribute('data-key');
            element.textContent = translations[selectedLang][key] || element.textContent;
        });

        document.getElementById('plantingTable').style.display = 'table';
    }

    // Initialize table with the correct language
    showCalendar();
